<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle</title>
<style>
:root{--bg:#f6efe4;--tx:#3b2a17;--card:#fff;--wood1:#f3e3c7;--wood2:#e2c99f;--slot:#b98f5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2a33;--tx:#f1e8d8;--card:#2b3d49;--wood1:#d9c19a;--wood2:#b79a6b;--slot:#8c6a3d}}
:root[data-theme="dark"]{--bg:#1b2a33;--tx:#f1e8d8;--card:#2b3d49;--wood1:#d9c19a;--wood2:#b79a6b;--slot:#8c6a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 14px 24px}
h1{margin:0;font-size:1.5rem}
.stats{display:flex;gap:10px}
.stats div{background:var(--card);border-radius:12px;padding:6px 14px;font-weight:600;min-width:90px;text-align:center}
.frame{width:min(92vw,440px);aspect-ratio:1;padding:6%;border-radius:14px;background:linear-gradient(135deg,var(--wood1),var(--wood2));box-shadow:0 6px 18px rgba(0,0,0,.3),inset 0 0 0 2px rgba(255,255,255,.35)}
.board{position:relative;width:100%;height:100%;background:var(--slot);border-radius:6px;box-shadow:inset 0 3px 8px rgba(0,0,0,.4);touch-action:none;user-select:none}
.tile{position:absolute;width:var(--cell,33.333%);height:var(--cell,33.333%);padding:2px;transition:left .18s ease,top .18s ease,opacity .5s;cursor:pointer}
.tile svg{width:100%;height:100%;display:block;border-radius:5px;box-shadow:0 2px 4px rgba(0,0,0,.35);pointer-events:none}
.tile.ghost{opacity:0;pointer-events:none}
.tile.ghost.show{opacity:1}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 18px;background:#1e88d6;color:#fff;cursor:pointer}
button.alt{background:var(--card);color:var(--tx)}
button:active{transform:scale(.96)}
#msg{min-height:1.6em;font-weight:700;font-size:1.15rem;text-align:center}
.prev{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:5}
.prev.on{display:flex}
.prev .frame{width:min(88vw,420px)}
.prev .tile{cursor:default;transition:none}
.tile::after{content:"";position:absolute;inset:2px;border-radius:5px;pointer-events:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45),inset 2px 2px 3px rgba(255,255,255,.35),inset -2px -3px 5px rgba(0,0,0,.3)}
.tile.ghost::after{display:none}
#pn{font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--wood2);background:var(--card);color:var(--tx);width:min(80vw,260px);text-align:center}
.hbox{background:var(--card);color:var(--tx);border-radius:16px;padding:16px;width:min(92vw,420px);max-height:80vh;overflow:auto}
.hbox h2{margin:0 0 8px;font-size:1.2rem}.hbox h3{margin:14px 0 4px;font-size:1rem;opacity:.8}
.hr{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(128,128,128,.25);font-size:.95rem}
.hb{display:flex;gap:10px;justify-content:center;margin-top:14px}
button:disabled{opacity:.4;cursor:default}
.picks{display:flex;gap:10px}
.pk{width:56px;height:56px;padding:0;border-radius:14px;border:3px solid transparent;overflow:hidden;background:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pk.on{border-color:#1e88d6}
.pk svg{width:100%;height:100%;display:block}
.tile.drag{transition:none;z-index:2;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
#home{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;overflow:auto}
#home.off{display:none}
#hero{width:min(58vw,230px);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:rotate(-4deg);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:rotate(3deg) translateY(-10px)}}
#home h2{margin:0;font-size:2.3rem}
.tag{margin:0;opacity:.8;font-size:1.05rem}
.pk.big{width:72px;height:72px}
#play{font-size:1.4rem;padding:14px 46px;border-radius:30px;box-shadow:0 6px 16px rgba(30,136,214,.5);animation:pu 1.6s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.06)}}
</style>
</head>

<script>
var board=document.getElementById('board'),mvEl=document.getElementById('mv'),tmEl=document.getElementById('tm'),msg=document.getElementById('msg');
var pos=[],tiles=[],moves=0,start=0,timer=null,playing=false;
// pos[i] = id de la pièce à la case i ; 8 = case vide
for(var k=0;k<9;k++){
  var d=document.createElement('div');d.className='tile'+(k==8?' ghost':'');
  d.innerHTML='<svg viewBox="'+(k%3)*100+' '+Math.floor(k/3)*100+' 100 100"><use href="#scene"/></svg>';
  
  board.appendChild(d);tiles.push(d);
}
var CELL=0;
function fit(b){b.style.width=b.style.height='';var c=Math.floor(b.clientWidth/3);b.style.width=b.style.height=c*3+'px';b.style.margin='0 auto';b.style.setProperty('--cell',c+'px');return c}
function render(){
  if(!CELL)CELL=fit(board);
  for(var i=0;i<9;i++){var t=tiles[pos[i]];t.style.left=(i%3)*CELL+'px';t.style.top=Math.floor(i/3)*CELL+'px';}
}
addEventListener('resize',function(){CELL=fit(board);render()});
function tap(id,force){
  if(paused||((solving||mixing)&&!force))return;
  if(!force&&mixed&&!playing&&!solving&&!mixing)startGame();
  var i=pos.indexOf(id),e=pos.indexOf(8),r=Math.floor(i/3),c=i%3,er=Math.floor(e/3),ec=e%3;
  if(r!=er&&c!=ec)return;
  var step=r==er?(ec>c?1:-1):(er>r?3:-3);
  // décale toute la ligne/colonne vers la case vide
  var j=e;
  while(j!=i){pos[j]=pos[j-step];j-=step;}
  pos[i]=8;
  if(navigator.vibrate)navigator.vibrate(8);
  tick();
  if(playing){moves++;mvEl.textContent=moves;}render();check();shufUI();
}
function solved(){for(var i=0;i<9;i++)if(pos[i]!=i)return false;return true}
function check(){
  if(!playing||!solved())return;
  playing=false;clearInterval(timer);
  var secs=Math.floor((Date.now()-start)/1000);tmEl.textContent=fmt(secs);saveScore(secs);
  tiles[8].classList.add('show');
  msg.textContent=winText();
  fanfare();confetti();setTimeout(confetti,500);
}
var AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC}
function note(f,t,d,type,vol){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.value=f;var s=a.currentTime+t;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol||0.25,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+0.05)}
function tick(){note(320,0,0.07,'sine',0.12)}
function fanfare(){[523,659,784,1047].forEach(function(f,i){note(f,i*0.13,0.35)});[784,1047,1319].forEach(function(f){note(f,0.6,0.9,'triangle',0.18)})}
function confetti(){
  var c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9';
  var W=c.width=innerWidth,H=c.height=innerHeight;document.body.appendChild(c);var x=c.getContext('2d');
  var cols=['#f6c453','#2fa8e6','#ff6b6b','#7bd88f','#c792ea','#ffffff'],p=[];
  for(var i=0;i<160;i++)p.push({x:W/2+(Math.random()-.5)*80,y:H*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,w:6+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]});
  var t0=Date.now();
  (function f(){var el=Date.now()-t0;x.clearRect(0,0,W,H);
    p.forEach(function(q){q.vy+=.3;q.vx*=.99;q.x+=q.vx;q.y+=q.vy;q.r+=q.vr;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.globalAlpha=Math.max(0,Math.min(1,1-(el-2500)/1500));x.fillRect(-q.w/2,-q.h/2,q.w,q.h);x.restore()});
    if(el<4000)requestAnimationFrame(f);else c.remove()})();
}
function shuffle(){
  pos=[0,1,2,3,4,5,6,7,8];tiles[8].classList.remove('show');
  var e=8,last=-1;
  for(var n=0;n<150;n++){
    var r=Math.floor(e/3),c=e%3,opts=[];
    if(r>0)opts.push(e-3);if(r<2)opts.push(e+3);if(c>0)opts.push(e-1);if(c<2)opts.push(e+1);
    opts=opts.filter(function(o){return o!=last});
    var o=opts[Math.floor(Math.random()*opts.length)];
    pos[e]=pos[o];pos[o]=8;last=e;e=o;
  }
  if(solved())return shuffle();
  moves=0;mvEl.textContent=0;msg.textContent='';playing=true;paused=false;pauseUI();
  clearInterval(timer);start=Date.now();tmEl.textContent='0:00';
  timer=setInterval(function(){var s=Math.floor((Date.now()-start)/1000);tmEl.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2)},500);
  render();
}
// swipe : glisser une pièce vers la case vide
var sx,sy,sid=null;
board.addEventListener('touchstart',function(ev){var t=ev.target.closest('.tile');sid=t?tiles.indexOf(t):null;sx=ev.touches[0].clientX;sy=ev.touches[0].clientY},{passive:true});
document.getElementById('shuf').onclick=shuffle;
var pb=document.getElementById('pb'),ptiles=[];
for(var q=0;q<8;q++){
  var pt=document.createElement('div');pt.className='tile';
  ptiles.push(pt);
  pt.innerHTML='<svg viewBox="'+(q%3)*100+' '+Math.floor(q/3)*100+' 100 100"><use href="#scene"/></svg>';
  pb.appendChild(pt);
}
var prev=document.getElementById('prev');
document.getElementById('peek').onclick=function(){prev.classList.add('on');var c=fit(pb);ptiles.forEach(function(t,q){t.style.left=(q%3)*c+'px';t.style.top=Math.floor(q/3)*c+'px'})};

var LANG='ar';
try{LANG=localStorage.getItem('puzzle_lang')||'ar'}catch(e){}
function T(k){return I[LANG][k]}
function winText(){return T('win').replace('{m}',moves).replace('{t}',tmEl.textContent)}
function setLang(l){
  LANG=l;try{localStorage.setItem('puzzle_lang',l)}catch(e){}
  document.documentElement.lang=l;document.documentElement.dir=l=='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=T(e.getAttribute('data-t'))});
  document.title=T('title');
  document.querySelectorAll('[data-ph]').forEach(function(e){e.placeholder=T(e.getAttribute('data-ph'))});
  var hh=document.getElementById('hm');if(hh&&hh.classList.contains('on'))renderHist();
  if(tiles[8].classList.contains('show'))msg.textContent=autoSolved?T('solved').replace('{n}',autoN):winText();else if(solving)msg.textContent=T('solving');else if(!playing)msg.textContent=T('hint');
}
document.getElementById('lng').onclick=function(){setLang(LANG=='fr'?'ar':'fr')};
setLang(LANG);
var paused=false,pauseAt=0;
var pov=document.createElement('div');pov.setAttribute('data-t','tap');pov.textContent=T('tap');
pov.style.cssText='position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:10px;background:var(--slot);color:#fff;font-weight:700;font-size:1.3rem;z-index:3;cursor:pointer;border-radius:6px';
board.appendChild(pov);
function tickTimer(){var s=Math.floor((Date.now()-start)/1000);tmEl.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function pauseUI(){var b=document.getElementById('pz');b.setAttribute('data-t',paused?'resume':'pause');b.textContent=T(paused?'resume':'pause');pov.style.display=paused?'flex':'none'}
function setPause(p){
  if(!playing||p==paused)return;
  paused=p;
  if(p){pauseAt=Date.now();clearInterval(timer)}
  else{start+=Date.now()-pauseAt;tickTimer();timer=setInterval(tickTimer,500)}
  pauseUI();
}
document.getElementById('pz').onclick=function(){setPause(!paused)};
pov.onclick=function(){setPause(false)};
document.addEventListener('visibilitychange',function(){if(document.hidden)setPause(true)});
function shufUI(){var b=document.getElementById('shuf');var k=(playing||solving||tiles[8].classList.contains('show'))?'restart':'start';b.setAttribute('data-t',k);b.textContent=T(k);
  var free=!playing&&!solving&&!tiles[8].classList.contains('show');
  b.style.display=(free&&solved())?'none':'';
  var mb=document.getElementById('mix');mb.style.display=free?'':'none';mb.disabled=mixing;
  document.getElementById('pz').style.display=playing?'':'none'}
function resetFree(){
  pos=[0,1,2,3,4,5,6,7,8];playing=false;paused=false;clearInterval(timer);solveTok++;solving=false;autoSolved=false;mixed=false;
  moves=0;mvEl.textContent=0;tmEl.textContent='0:00';
  tiles[8].classList.remove('show');msg.textContent=T('hint');
  render();pauseUI();shufUI();ctrlUI();
}
function startGame(){
  if(solved()){msg.textContent=T('mixfirst');return}
  playing=true;paused=false;moves=0;mvEl.textContent=0;msg.textContent='';
  clearInterval(timer);start=Date.now();tmEl.textContent='0:00';timer=setInterval(tickTimer,500);
  pauseUI();shufUI();
}
document.getElementById('shuf').onclick=function(){
  if(mixing)return;
  if(solving||playing||tiles[8].classList.contains('show'))resetFree();else startGame();
};
var HK='dauphin_hist',NK='dauphin_name',pn=document.getElementById('pn'),hm=document.getElementById('hm'),clrArm=false;
function loadH(){try{return JSON.parse(localStorage.getItem(HK)||'[]')}catch(e){return[]}}
function saveH(a){try{localStorage.setItem(HK,JSON.stringify(a))}catch(e){}}
try{pn.value=localStorage.getItem(NK)||''}catch(e){}
pn.oninput=function(){try{localStorage.setItem(NK,pn.value)}catch(e){}};
function fmt(s){return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function saveScore(s){var a=loadH();a.push({n:pn.value.trim().slice(0,20),m:moves,t:s,d:Date.now()});saveH(a.slice(-100))}
function hrow(r,i){
  var d=document.createElement('div');d.className='hr';
  var a=document.createElement('span');a.textContent=(i!=null?(i+1)+'. ':'')+(r.n||T('anon'));
  var b=document.createElement('span');
  b.textContent=fmt(r.t)+' · '+r.m+' '+T('coupsw')+(i==null?' · '+new Date(r.d).toLocaleDateString(LANG=='ar'?'ar-DZ-u-nu-latn':'fr-FR',{day:'2-digit',month:'2-digit'}):'');
  d.appendChild(a);d.appendChild(b);return d;
}
function renderHist(){
  var box=document.getElementById('hl');box.textContent='';var a=loadH();
  if(!a.length){box.textContent=T('empty');return}
  var h=document.createElement('h3');h.textContent=T('best');box.appendChild(h);
  a.slice().sort(function(x,y){return x.t-y.t||x.m-y.m}).slice(0,5).forEach(function(r,i){box.appendChild(hrow(r,i))});
  h=document.createElement('h3');h.textContent=T('recent');box.appendChild(h);
  a.slice().reverse().slice(0,20).forEach(function(r){box.appendChild(hrow(r,null))});
}
function closeH(){hm.classList.remove('on')}
document.getElementById('hist').onclick=function(){setPause(true);renderHist();hm.classList.add('on')};
hm.onclick=function(e){if(e.target===hm)closeH()};
document.getElementById('hx').onclick=closeH;
document.getElementById('hclr').onclick=function(){
  var b=this;
  if(!clrArm){clrArm=true;b.textContent=T('sure');setTimeout(function(){clrArm=false;b.textContent=T('clear')},3000);return}
  clrArm=false;saveH([]);b.textContent=T('clear');renderHist();
};
var solving=false,autoSolved=false,autoN=0,solveTok=0;
function solvePath(s){
  var q=s.slice(),path=[],FOUND=-1;
  function man(){var h=0;for(var i=0;i<9;i++){var v=q[i];if(v===8)continue;h+=Math.abs((i/3|0)-(v/3|0))+Math.abs(i%3-v%3)}return h}
  function nb(e){var r=e/3|0,c=e%3,n=[];if(r>0)n.push(e-3);if(r<2)n.push(e+3);if(c>0)n.push(e-1);if(c<2)n.push(e+1);return n}
  function search(g,bound,e,last){
    var h=man(),f=g+h;if(f>bound)return f;if(h===0)return FOUND;
    var min=Infinity,n=nb(e);
    for(var i=0;i<n.length;i++){
      var m=n[i];if(m===last)continue;
      var w=q[e];q[e]=q[m];q[m]=w;path.push(m);
      var t=search(g+1,bound,m,e);if(t===FOUND)return FOUND;if(t<min)min=t;
      path.pop();w=q[e];q[e]=q[m];q[m]=w;
    }
    return min;
  }
  var bound=man(),e0=q.indexOf(8);
  while(true){var t=search(0,bound,e0,-1);if(t===FOUND)return path.slice();bound=t}
}
var SP=[],SK=0,SE=0,SAUTO=false;
function ctrlUI(){
  document.getElementById('sc').style.display=solving?'flex':'none';
  document.getElementById('sb').disabled=SK<=0;
  document.getElementById('sf').disabled=SK>=SP.length;
  var p=document.getElementById('sp');p.textContent=SAUTO?'⏸':'▶';p.disabled=SK>=SP.length;
  document.getElementById('sn').textContent=SK+' / '+SP.length;
}
function sFwd(){
  if(SK>=SP.length)return;
  tap(pos[SP[SK++]],true);
  if(SK>=SP.length){SAUTO=false;autoSolved=true;autoN=SP.length;tiles[8].classList.add('show');msg.textContent=T('solved').replace('{n}',autoN)}
  ctrlUI();
}
function sBack(){
  if(SK<=0)return;
  var prev=SK>=2?SP[SK-2]:SE;
  tap(pos[prev],true);SK--;
  tiles[8].classList.remove('show');autoSolved=false;msg.textContent=T('solving');
  ctrlUI();
}
function sLoop(tok){
  if(tok!==solveTok||!SAUTO)return;
  if(SK>=SP.length){SAUTO=false;ctrlUI();return}
  sFwd();
  setTimeout(function(){sLoop(tok)},380);
}
document.getElementById('sv').onclick=function(){
  if(solving||solved())return;
  SP=solvePath(pos);SK=0;SE=pos.indexOf(8);
  solving=true;autoSolved=false;playing=false;paused=false;clearInterval(timer);pauseUI();
  msg.textContent=T('solving');shufUI();
  SAUTO=true;ctrlUI();sLoop(++solveTok);
};
document.getElementById('sp').onclick=function(){
  SAUTO=!SAUTO;var tok=++solveTok;
  if(SAUTO)sLoop(tok);
  ctrlUI();
};
document.getElementById('sf').onclick=function(){SAUTO=false;solveTok++;sFwd();ctrlUI()};
document.getElementById('sb').onclick=function(){SAUTO=false;solveTok++;sBack();ctrlUI()};
document.getElementById('sx').onclick=function(){
  solveTok++;SAUTO=false;solving=false;
  if(SK<SP.length)msg.textContent=T('hint');
  ctrlUI();shufUI();
};
var IMG=1;try{var si=localStorage.getItem('puzzle_img');if(si!==null)IMG=+si}catch(e){}
function setImage(n){
  IMG=n;try{localStorage.setItem('puzzle_img',n)}catch(e){}
  var ref=n?'#scene2':'#scene';
  tiles.concat(ptiles).forEach(function(t){t.querySelector('use').setAttribute('href',ref)});
  document.getElementById('i0').classList.toggle('on',n==0);
  document.getElementById('i1').classList.toggle('on',n==1);
  document.getElementById('hi0').classList.toggle('on',n==0);
  document.getElementById('hi1').classList.toggle('on',n==1);
  document.getElementById('hero').querySelector('use').setAttribute('href',ref);
}
document.getElementById('i0').onclick=function(){setImage(0)};
document.getElementById('i1').onclick=function(){setImage(1)};
var mixing=false,mixed=false;
document.getElementById('mix').onclick=function(){
  if(mixing||solving||playing)return;
  mixing=true;shufUI();msg.textContent='';
  var last=-1,n=0;
  (function step(){
    var e=pos.indexOf(8),r=(e/3)|0,c=e%3,o=[];
    if(r>0)o.push(e-3);if(r<2)o.push(e+3);if(c>0)o.push(e-1);if(c<2)o.push(e+1);
    o=o.filter(function(x){return x!==last});
    if(n>=26&&!solved()){mixing=false;mixed=true;shufUI();return}
    var m=o[Math.floor(Math.random()*o.length)];last=e;n++;
    tap(pos[m],true);
    setTimeout(step,110);
  })();
};
var home=document.getElementById('home');
function showHome(){setPause(true);home.classList.remove('off')}
document.getElementById('play').onclick=function(){ac();note(659,0,.12);note(880,.1,.22);home.classList.add('off')};
document.getElementById('gohome').onclick=showHome;
document.getElementById('hl').onclick=function(){setLang(LANG=='fr'?'ar':'fr')};
document.getElementById('hi0').onclick=function(){setImage(0)};
document.getElementById('hi1').onclick=function(){setImage(1)};
var dg=null;
board.addEventListener('pointerdown',function(ev){
  if(paused||solving||mixing||tiles[8].classList.contains('show'))return;
  var t=ev.target.closest&&ev.target.closest('.tile');
  if(!t||t.classList.contains('ghost'))return;
  if(!playing&&!mixed){msg.textContent=T('mixfirst');return}
  var id=tiles.indexOf(t),i=pos.indexOf(id),e=pos.indexOf(8),ax,unit;
  if(((i/3)|0)===((e/3)|0)){ax='x';unit=1}else if(i%3===e%3){ax='y';unit=3}else return;
  var sg=e>i?1:-1,g=[];
  for(var j=i;j!==e;j+=sg*unit)g.push({t:tiles[pos[j]],idx:j});
  dg={id:id,ax:ax,sg:sg,g:g,x0:ev.clientX,y0:ev.clientY,off:0,moved:false};
  try{board.setPointerCapture(ev.pointerId)}catch(x){}
});
board.addEventListener('pointermove',function(ev){
  if(!dg)return;
  var dx=ev.clientX-dg.x0,dy=ev.clientY-dg.y0;
  if(!dg.moved&&Math.abs(dx)+Math.abs(dy)>8)dg.moved=true;
  if(!dg.moved)return;
  var d=(dg.ax==='x'?dx:dy)*dg.sg;
  dg.off=Math.max(0,Math.min(CELL,d));
  dg.g.forEach(function(o){
    o.t.classList.add('drag');
    o.t.style.left=((o.idx%3)*CELL+(dg.ax==='x'?dg.sg*dg.off:0))+'px';
    o.t.style.top=(((o.idx/3)|0)*CELL+(dg.ax==='y'?dg.sg*dg.off:0))+'px';
  });
});
function endDrag(ev){
  if(!dg)return;
  var D=dg;dg=null;
  D.g.forEach(function(o){o.t.classList.remove('drag')});
  if(ev.type==='pointercancel'){render();return}
  if(!D.moved||D.off>CELL*0.3)tap(D.id);else render();
}
board.addEventListener('pointerup',endDrag);
board.addEventListener('pointercancel',endDrag);
setImage(IMG);
resetFree();
</script>
