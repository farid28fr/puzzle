<style>
:root{--bg:#f6efe4;--tx:#3b2a17;--card:#fff;--wood1:#f3e3c7;--wood2:#e2c99f;--slot:#b98f5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2a33;--tx:#f1e8d8;--card:#2b3d49;--wood1:#d9c19a;--wood2:#b79a6b;--slot:#8c6a3d}}
:root[data-theme="dark"]{--bg:#1b2a33;--tx:#f1e8d8;--card:#2b3d49;--wood1:#d9c19a;--wood2:#b79a6b;--slot:#8c6a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:54px 14px 24px}
h1{margin:0;font-size:1.5rem}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stats div.mini{min-width:0;padding:6px 12px}
.stats div{background:var(--card);border-radius:12px;padding:6px 14px;font-weight:600;min-width:90px;text-align:center}
.frame{width:min(92vw,440px);aspect-ratio:1;padding:6%;border-radius:14px;background:linear-gradient(135deg,var(--wood1),var(--wood2));box-shadow:0 6px 18px rgba(0,0,0,.3),inset 0 0 0 2px rgba(255,255,255,.35)}
.board{position:relative;width:100%;height:100%;background:var(--slot);border-radius:6px;box-shadow:inset 0 3px 8px rgba(0,0,0,.4);touch-action:none;user-select:none}
.tile{position:absolute;width:var(--cell,33.333%);height:var(--cell,33.333%);padding:2px;transition:left .18s ease,top .18s ease,opacity .5s;cursor:pointer}
.tile svg{width:100%;height:100%;display:block;border-radius:5px;box-shadow:0 2px 4px rgba(0,0,0,.35);pointer-events:none}
.tile.ghost{opacity:0;pointer-events:none}
.tile.ghost.show{opacity:1}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 18px;background:#1e88d6;color:#fff;cursor:pointer}
button.alt{background:var(--card);color:var(--tx)}
button:active{transform:scale(.96)}
#msg{min-height:1.6em;font-weight:700;font-size:1.15rem;text-align:center}
.prev{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:5}
.prev.on{display:flex}
.prev .frame{width:min(88vw,420px)}
.prev .tile{cursor:default;transition:none}
.tile::after{content:"";position:absolute;inset:2px;border-radius:5px;pointer-events:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45),inset 2px 2px 3px rgba(255,255,255,.35),inset -2px -3px 5px rgba(0,0,0,.3)}
.tile.ghost::after{display:none}
#pn{font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--wood2);background:var(--card);color:var(--tx);width:min(80vw,260px);text-align:center}
.hbox{background:var(--card);color:var(--tx);border-radius:16px;padding:16px;width:min(92vw,420px);max-height:80vh;overflow:auto}
.hbox h2{margin:0 0 8px;font-size:1.2rem}.hbox h3{margin:14px 0 4px;font-size:1rem;opacity:.8}
.hr{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(128,128,128,.25);font-size:.95rem}
.hb{display:flex;gap:10px;justify-content:center;margin-top:14px}
#hm .hbox{width:min(94vw,460px)}
.tw{border-radius:12px;overflow:hidden;background:rgba(128,128,128,.08);margin-bottom:6px}
.tw table{width:100%;border-collapse:collapse;font-size:.9rem}
.tw th{background:rgba(128,128,128,.22);font-size:.75rem;font-weight:700;padding:9px 6px;text-align:center;white-space:nowrap}
.tw td{padding:9px 6px;text-align:center;border-top:1px solid rgba(128,128,128,.18);font-variant-numeric:tabular-nums}
.tw th.nm,.tw td.nm{text-align:start}
.tw td.nm{font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw td.an{opacity:.6;font-style:italic;font-weight:400}
.tw tbody tr:nth-child(even) td{background:rgba(128,128,128,.07)}
.tw tr.top td{background:rgba(255,200,61,.16)}
.tw td.rk{font-weight:700;width:34px}
.tw td.tm{font-weight:700}
.tw td.dt,.tw td.mv{opacity:.85}
.st{color:#ffc83d;letter-spacing:1px;white-space:nowrap}
.st0{opacity:.3}
.emp{text-align:center;padding:24px 0;opacity:.7}
.tabs{display:flex;gap:8px;margin:6px 0 4px}
.tabs button{flex:1;padding:8px 10px;font-size:.9rem;background:rgba(128,128,128,.2);color:var(--tx)}
.tabs button.on{background:#1e88d6;color:#fff}
button:disabled{opacity:.4;cursor:default}
.picks{display:flex;gap:10px;max-width:100%;overflow-x:auto;padding:8px 14px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}
.picks::-webkit-scrollbar{display:none}
.picks>.pk:first-child{margin-inline-start:auto}
.picks>.pk:last-child{margin-inline-end:auto}
.pk{flex:0 0 auto;scroll-snap-align:center;width:56px;height:56px;padding:0;border-radius:14px;border:3px solid transparent;overflow:hidden;background:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pk.on{border-color:#1e88d6}
.pk svg{width:100%;height:100%;display:block}
.tile.drag{transition:none;z-index:2;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
#home{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:54px 20px 20px;text-align:center;overflow:auto}
#home.off{display:none}
#home>*{flex-shrink:0}
#home{justify-content:safe center}
@media (max-height:720px){#home{gap:10px;padding-top:46px}#hero{width:min(42vw,170px)}}
body{background:radial-gradient(120% 55% at 50% 0,var(--tint,transparent),transparent) fixed,var(--bg)}
#home{background:radial-gradient(120% 55% at 50% 0,var(--tint,transparent),transparent),var(--bg)}
#wa{margin:6px 0;font-weight:800;color:#f6c453}
#hero{width:min(58vw,230px);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:rotate(-4deg);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:rotate(3deg) translateY(-10px)}}
#home h2{margin:0;font-size:2.3rem}
.tag{margin:0;opacity:.8;font-size:1.05rem}
.pk.big{width:72px;height:72px}
#online{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);z-index:25;font-size:.8rem;opacity:.85;background:var(--card);color:var(--tx);padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:6px;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.25);white-space:nowrap}
#online i{width:8px;height:8px;border-radius:50%;background:#2ecc71;display:inline-block}
.ib{width:36px;height:36px;border-radius:50%;padding:0;font-weight:700;font-family:Georgia,serif;font-size:1.2rem}
#info{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-start:12px;z-index:4}
#hinfo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-start:12px}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-start:56px;z-index:4}
#hmute{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-start:56px}
#ws{font-size:2.8rem;color:#ffc83d;letter-spacing:6px;margin-top:18px;text-shadow:0 2px 8px rgba(0,0,0,.5);animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
#share,#wsh{background:#1e88d6;color:#fff}
#shm{z-index:45}
.shb{display:block;width:100%;text-align:center;padding:12px;margin:8px 0;border-radius:12px;background:#1e88d6;color:#fff;font:inherit;font-weight:600;text-decoration:none;border:0;cursor:pointer}
.shb.alt{background:rgba(128,128,128,.25);color:var(--tx)}
#wsh{margin-top:14px;font-size:1rem}
#tipm{z-index:30}
#win{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);cursor:pointer}
#win.on{display:flex}
.wc{text-align:center;color:#fff;font-weight:700;font-size:1.3rem;padding:20px}
.wb{position:relative;display:inline-block}
#wsv{width:min(62vw,260px);display:block;border-radius:22px;border:6px solid #fff;box-shadow:0 12px 36px rgba(0,0,0,.5);transform-origin:50% 100%;animation:wj 1s ease-in-out infinite}
@keyframes wj{0%,100%{transform:translateY(0) rotate(-4deg) scale(1)}25%{transform:translateY(-34px) rotate(4deg) scale(1.03,.99)}50%{transform:translateY(0) rotate(-4deg) scale(1.06,.94)}75%{transform:translateY(-18px) rotate(3deg)}}
.hand{position:absolute;right:-20px;top:-26px;font-size:2.6rem;transform-origin:70% 80%;animation:wv .45s ease-in-out infinite alternate}
@keyframes wv{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
.fl{position:absolute;font-size:1.8rem;animation:fa 1.6s ease-in-out infinite}
.f1{left:-24px;top:20%}.f2{right:-28px;top:55%;animation-delay:.4s}.f3{left:-10px;bottom:-16px;animation-delay:.8s}
@keyframes fa{50%{transform:translateY(-14px) scale(1.25)}}
#wt{margin-top:22px}
.tile.hint::before{content:attr(data-arrow);position:absolute;inset:2px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:2.8rem;font-weight:900;color:#fff;text-shadow:0 0 6px #000,0 0 12px #000;box-shadow:0 0 0 4px #ffd54a,0 0 20px 8px rgba(255,213,74,.95);z-index:3;pointer-events:none;animation:hp .6s ease-in-out infinite alternate}
@keyframes hp{from{opacity:.5}to{opacity:1}}
#wr{margin-top:12px;font-size:1.05rem;color:#ffe08a}
#wr.new{font-size:1.25rem;color:#ffc83d;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
#wk{margin-top:6px;font-size:1rem;color:#ffb066}
#wd{margin-top:6px;font-size:1rem;color:#ff9a76}
#wu{margin-top:10px;font-size:1rem;color:#8dffb3}
.wur{display:flex;gap:8px;justify-content:center;margin-top:6px}
.wut{width:48px;height:48px;border-radius:12px;overflow:hidden;border:2px solid #8dffb3;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.wut svg{width:100%;height:100%;display:block}
.pk{position:relative}
.pk.lock svg{filter:grayscale(1) brightness(.4)}
.pk.lock::after{content:'🔒';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);background:rgba(20,20,20,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:.95rem;z-index:60;max-width:88vw;text-align:center;display:none}
#wlb{display:block;margin:14px auto 0;background:rgba(255,255,255,.2);color:#fff;font-size:1rem}
#daily{font-size:1.05rem;padding:12px 30px;border-radius:26px;background:linear-gradient(135deg,#ff7a18,#ff3d71);color:#fff;box-shadow:0 5px 14px rgba(255,61,113,.45)}
#wag{display:block;margin:18px auto 0;font-size:1.25rem;padding:14px 44px;border-radius:30px;background:#2ecc71;color:#fff;box-shadow:0 6px 16px rgba(46,204,113,.5)}
.tip{padding:8px 0;border-bottom:1px solid rgba(128,128,128,.25)}
.tip b{display:block;margin-bottom:3px}
.tip span{opacity:.9;font-size:.95rem;line-height:1.55}
#play{font-size:1.4rem;padding:14px 46px;border-radius:30px;box-shadow:0 6px 16px rgba(30,136,214,.5);animation:pu 1.6s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.06)}}
</style>
</head>

var solving=false,autoSolved=false,autoN=0,solveTok=0,assisted=false;
function solvePath(s){
  var q=s.slice(),path=[],FOUND=-1;
  function man(){var h=0;for(var i=0;i<9;i++){var v=q[i];if(v===8)continue;h+=Math.abs((i/3|0)-(v/3|0))+Math.abs(i%3-v%3)}return h}
  function nb(e){var r=e/3|0,c=e%3,n=[];if(r>0)n.push(e-3);if(r<2)n.push(e+3);if(c>0)n.push(e-1);if(c<2)n.push(e+1);return n}
  function search(g,bound,e,last){
    var h=man(),f=g+h;if(f>bound)return f;if(h===0)return FOUND;
    var min=Infinity,n=nb(e);
    for(var i=0;i<n.length;i++){
      var m=n[i];if(m===last)continue;
      var w=q[e];q[e]=q[m];q[m]=w;path.push(m);
      var t=search(g+1,bound,m,e);if(t===FOUND)return FOUND;if(t<min)min=t;
      path.pop();w=q[e];q[e]=q[m];q[m]=w;
    }
    return min;
  }
  var bound=man(),e0=q.indexOf(8);
  while(true){var t=search(0,bound,e0,-1);if(t===FOUND)return path.slice();bound=t}
}

      var e=c.e,r=e>>2,col=e&3,nb=[];if(r>0)nb.push(e-4);if(r<3)nb.push(e+4);if(col>0)nb.push(e-1);if(col<3)nb.push(e+1);
      for(var q=0;q<nb.length;q++){
        var m=nb[q];if(c.p&&c.p.e===m)continue;
        var v=c.s[m],s2=c.s.slice();s2[e]=v;s2[m]=15;
        var g=c.g+1,k=String.fromCharCode.apply(null,s2);
        if(seen[k]!==undefined&&seen[k]<=g)continue;seen[k]=g;
        push({s:s2,e:m,g:g,h:c.h-D[v][m]+D[v][e],p:c,m:m});
      }
    }
    return null;
  }
  return run(3,150000)||run(6,400000)||run(30,1500000)||[];
}
var _spath=solvePath;solvePath=function(st){return N===3?_spath(st):solve4(st)};
